name: Update Zen model data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-models
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update models.json
        run: python update_zen_prices.py --output docs/models.json

      - name: Prune N.A. models older than 6 months
        run: python prune_na_models.py --output docs/models.json

      - name: Commit and push changes
        run: |
          if git diff --quiet -- docs/models.json docs/index.html; then
            echo "No changes; skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/models.json docs/index.html
            git commit -m "chore: update Zen model data (daily)"
            git push
          fi