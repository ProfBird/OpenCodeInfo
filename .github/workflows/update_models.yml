name: Update Zen model data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-models
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update models.json
        run: python update_zen_prices.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- models.json; then
            echo "No changes to models.json; skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models.json
            git commit -m "chore: update Zen model pricing (daily)"
            git push
          fi